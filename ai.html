<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Support | Rare Grade</title>
  <!-- Using Outfit for headers (similar to Uber Move) and Inter for UI body -->
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Rounded" rel="stylesheet"/>
  <style>
    :root {
      /* Uber-style Minimalist Palette */
      --bg-main: #f6f6f6;
      --bg-card: #ffffff;
      --border: #e2e2e2;
      --black: #000000;
      --text-main: #000000;
      --text-dim: #545454;
      --text-light: #ffffff;
      --accent: #276ef1; /* Standard link/active blue */
      --danger: #e11d48;
      --success: #05a357;
      --font-head: 'Outfit', sans-serif;
      --font-body: 'Inter', sans-serif;
    }

    *, *::before, *::after { 
      margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; 
    }

    body {
      font-family: var(--font-body);
      background: var(--bg-main);
      color: var(--text-main);
      height: 100svh;
      display: flex; 
      flex-direction: column;
      overflow: hidden; 
      position: relative;
    }

    /* Screen Management */
    .screen {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 10; transition: opacity 0.3s ease, transform 0.3s ease;
      padding: 24px;
      background: var(--bg-main);
    }
    .hidden { opacity: 0; pointer-events: none; transform: scale(0.98); z-index: -1; }

    /* AUTH & SETUP SCREENS */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px;
      width: 100%; max-width: 400px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04);
    }

    .brand-icon {
      width: 64px; height: 64px; margin: 0 auto 24px;
      background: var(--black);
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      color: white;
    }

    .title { font-family: var(--font-head); font-size: 2rem; font-weight: 700; margin-bottom: 8px; letter-spacing: -0.5px; }
    .subtitle { color: var(--text-dim); font-size: 0.95rem; line-height: 1.5; margin-bottom: 32px; }
    
    .status-badge {
      display: inline-block; padding: 4px 12px; border-radius: 99px;
      font-size: 0.75rem; font-weight: 600; margin-bottom: 16px;
      background: #e8f5e9; color: var(--success); text-transform: uppercase; letter-spacing: 0.5px;
    }

    /* BUTTONS */
    .btn {
      width: 100%; padding: 16px; border-radius: 8px;
      font-family: var(--font-body); font-size: 1rem; font-weight: 600;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 12px;
      transition: all 0.2s; border: none; margin-bottom: 12px;
    }
    .btn-primary { background: var(--black); color: var(--text-light); }
    .btn-primary:hover { background: #333; }
    .btn-outline { background: transparent; border: 1px solid var(--black); color: var(--black); }
    .btn-outline:hover { background: rgba(0,0,0,0.05); }

    /* CALL SCREEN */
    .call-header { position: absolute; top: 0; width: 100%; padding: 40px 24px 0; display: flex; flex-direction: column; align-items: center; }
    .call-app-name { font-family: var(--font-head); font-size: 1.25rem; font-weight: 600; }
    .call-status { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--text-dim); margin-top: 8px; font-weight: 500; }
    
    .orb-wrap { position: relative; width: 200px; height: 200px; display: flex; align-items: center; justify-content: center; margin: 40px 0; }
    .orb-core {
      width: 120px; height: 120px; border-radius: 50%; background: var(--black);
      display: flex; align-items: center; justify-content: center; color: white;
      box-shadow: 0 12px 32px rgba(0,0,0,0.2); z-index: 2; transition: transform 0.3s;
    }
    .speaking .orb-core { transform: scale(1.05); background: var(--accent); }
    .orb-ring { position: absolute; border-radius: 50%; border: 1px solid rgba(0,0,0,0.1); width: 100%; height: 100%; animation: pulseRing 2s infinite; opacity: 0; }
    @keyframes pulseRing { 0% { transform: scale(0.8); opacity: 1; } 100% { transform: scale(1.5); opacity: 0; } }

    .agent-label { font-family: var(--font-head); font-size: 1.5rem; font-weight: 600; margin-bottom: 4px; }
    .agent-sublabel { color: var(--text-dim); font-size: 0.95rem; }

    .call-controls { position: absolute; bottom: 48px; display: flex; gap: 24px; align-items: center; }
    .ctrl-btn { width: 56px; height: 56px; border-radius: 50%; border: 1px solid var(--border); background: var(--bg-card); cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--black); transition: 0.2s; }
    .ctrl-btn:hover { background: #f0f0f0; }
    .ctrl-btn.muted { background: var(--black); color: white; }
    .ctrl-end { width: 64px; height: 64px; border-radius: 50%; background: var(--danger); color: white; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; }

    /* CHAT SCREEN */
    .chat-screen { position: absolute; inset: 0; background: var(--bg-card); display: flex; flex-direction: column; z-index: 30; }
    .chat-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; background: white; }
    .chat-back { background: none; border: none; cursor: pointer; display: flex; padding: 8px; margin-left: -8px; }
    .chat-agent-avatar { width: 40px; height: 40px; border-radius: 50%; background: #e2e2e2; display: flex; align-items: center; justify-content: center; font-size: 20px; }
    .chat-info h3 { font-family: var(--font-head); font-size: 1rem; margin: 0; }
    .chat-info p { font-size: 0.8rem; color: var(--success); margin: 0; font-weight: 500; }
    
    .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; background: var(--bg-main); }
    .chat-msg { max-width: 80%; padding: 12px 16px; border-radius: 12px; font-size: 0.95rem; line-height: 1.4; }
    .chat-msg.user { align-self: flex-end; background: var(--black); color: white; border-bottom-right-radius: 2px; }
    .chat-msg.agent { align-self: flex-start; background: white; border: 1px solid var(--border); border-bottom-left-radius: 2px; }

    .chat-controls { background: white; padding: 16px 20px; border-top: 1px solid var(--border); display: flex; gap: 12px; align-items: center; }
    .chat-input { flex: 1; padding: 14px 16px; border: 1px solid var(--border); border-radius: 8px; font-family: var(--font-body); font-size: 1rem; outline: none; background: var(--bg-main); }
    .chat-input:focus { border-color: var(--black); background: white; }
    .chat-send { background: var(--black); color: white; border: none; width: 48px; height: 48px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

  </style>
</head>
<body>

  <!-- AUTH SCREEN -->
  <div class="screen" id="authScreen">
    <div class="card">
      <div class="brand-icon">
        <span class="material-symbols-rounded" style="font-size: 32px;">support_agent</span>
      </div>
      <h1 class="title">Rare Grade Help</h1>
      <p class="subtitle">Sign in to access personalized technical support and account assistance.</p>
      <button class="btn btn-primary" onclick="signInWithGoogle()">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20" alt="Google" style="background: white; border-radius: 50%; padding: 2px;">
        Continue with Google
      </button>
    </div>
  </div>

  <!-- SETUP SCREEN (Choose Option) -->
  <div class="screen hidden" id="setupScreen">
    <div class="card">
      <div id="userBadge" class="status-badge">Authenticating...</div>
      <h1 class="title" id="welcomeText">Welcome</h1>
      <p class="subtitle">How would you like to get support today?</p>
      
      <button class="btn btn-primary" onclick="startCall()">
        <span class="material-symbols-rounded">call</span>
        Talk to AI Assistant
      </button>
      <button class="btn btn-outline" onclick="startLiveChat()">
        <span class="material-symbols-rounded">chat</span>
        Chat with Human Agent
      </button>
      <button class="btn btn-outline" style="margin-top: 16px; border-color: transparent; color: var(--text-dim);" onclick="signOutUser()">
        Sign Out
      </button>
    </div>
  </div>

  <!-- CALL SCREEN -->
  <div class="screen hidden" id="callScreen">
    <div class="call-header">
      <div class="call-app-name">AI Voice Support</div>
      <div class="call-status">
        <span id="sText">Connecting...</span>
      </div>
    </div>

    <div class="orb-wrap" id="orbWrap">
      <div class="orb-ring" style="animation-delay: 0s;"></div>
      <div class="orb-ring" style="animation-delay: 1s;"></div>
      <div class="orb-core">
        <span class="material-symbols-rounded" id="orbIcon" style="font-size: 48px;">graphic_eq</span>
      </div>
    </div>

    <div class="agent-label">System Assistant</div>
    <div class="agent-sublabel" id="agentSub">Listening...</div>

    <div class="call-controls">
      <button class="ctrl-btn" id="muteBtn" onclick="toggleMute()">
        <span class="material-symbols-rounded" id="muteIcon">mic</span>
      </button>
      <button class="ctrl-end" onclick="endCall()">
        <span class="material-symbols-rounded" style="font-size:28px;">call_end</span>
      </button>
    </div>
  </div>

  <!-- LIVE CHAT SCREEN -->
  <div class="chat-screen hidden" id="chatScreen">
    <div class="chat-header">
      <button class="chat-back" onclick="leaveLiveChat()">
        <span class="material-symbols-rounded">arrow_back</span>
      </button>
      <div class="chat-agent-avatar">👨‍💻</div>
      <div class="chat-info">
        <h3>Human Support Agent</h3>
        <p>● Online</p>
      </div>
    </div>
    <div class="chat-messages" id="chatMessages">
      <!-- Messages will load here from Firebase -->
    </div>
    <div class="chat-controls">
      <input type="text" class="chat-input" id="chatInput" placeholder="Type a message..." onkeypress="if(event.key==='Enter') sendChatMessage()">
      <button class="chat-send" onclick="sendChatMessage()">
        <span class="material-symbols-rounded">send</span>
      </button>
    </div>
  </div>

<script type="module">
  // Firebase Imports
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { getDatabase, ref, push, onChildAdded, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
  import { getRemoteConfig, fetchAndActivate, getString } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-remote-config.js";

  // Configuration
  const firebaseConfig = {
    apiKey: "AIzaSyBOyZ3As4GTuNvjemvPF_SpsC6m6vqtNhc",
    authDomain: "fire-b-a8878.firebaseapp.com",
    projectId: "fire-b-a8878",
    databaseURL: "https://fire-b-a8878-default-rtdb.firebaseio.com",
    appId: "1:658673187627:web:6e4c29af661785f0afa36e"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);
  
  // Remote Config for X.AI
  const rc = getRemoteConfig(app);
  rc.settings.minimumFetchIntervalMillis = 0;
  let XAI_API_KEY = "";
  fetchAndActivate(rc).then(() => { XAI_API_KEY = getString(rc, 'xai_api_key'); }).catch(console.error);

  const API_BASE = "https://api.x.ai/v1";
  
  // State
  let currentUser = null;
  let chatRef = null;
  let isCallActive = false, isMuted = false;
  let conversationHistory = [];
  let currentAudio = null, speechRecognition = null;

  // DOM Elements
  const els = {
    auth: document.getElementById('authScreen'),
    setup: document.getElementById('setupScreen'),
    call: document.getElementById('callScreen'),
    chat: document.getElementById('chatScreen'),
    userBadge: document.getElementById('userBadge'),
    welcomeText: document.getElementById('welcomeText'),
    chatMessages: document.getElementById('chatMessages'),
    chatInput: document.getElementById('chatInput'),
    orbWrap: document.getElementById('orbWrap'),
    sText: document.getElementById('sText'),
    agentSub: document.getElementById('agentSub')
  };

  function showScreen(screenId) {
    Object.values(els).forEach(el => el?.classList && el.classList.add('hidden'));
    document.getElementById(screenId).classList.remove('hidden');
  }

  /* =========================================
     AUTHENTICATION & USER CHECK
     ========================================= */
  onAuthStateChanged(auth, (user) => {
    if (user) {
      currentUser = user;
      const isNewUser = (user.metadata.creationTime === user.metadata.lastSignInTime);
      
      els.userBadge.innerText = isNewUser ? "New User" : "Retained User";
      els.welcomeText.innerText = `Welcome, ${user.displayName.split(' ')[0]}`;
      
      showScreen('setupScreen');
    } else {
      currentUser = null;
      showScreen('authScreen');
    }
  });

  window.signInWithGoogle = () => {
    const provider = new GoogleAuthProvider();
    signInWithPopup(auth, provider).catch(err => alert("Sign in failed: " + err.message));
  };

  window.signOutUser = () => {
    signOut(auth);
  };

  /* =========================================
     LIVE CHAT (HUMAN AGENT)
     ========================================= */
  window.startLiveChat = () => {
    showScreen('chatScreen');
    els.chatMessages.innerHTML = ''; 
    
    // Setup Firebase DB listener for this user's chats
    chatRef = ref(db, `chats/${currentUser.uid}`);
    onChildAdded(chatRef, (snapshot) => {
      const data = snapshot.val();
      renderChatMsg(data.sender, data.text);
    });

    // Auto welcome message if empty (mocking agent)
    setTimeout(() => {
      if (els.chatMessages.children.length === 0) {
        push(chatRef, { sender: 'agent', text: "Hi! You've reached Human Support. How can we help you today?", timestamp: serverTimestamp() });
      }
    }, 500);
  };

  window.sendChatMessage = () => {
    const text = els.chatInput.value.trim();
    if (!text || !chatRef) return;
    
    push(chatRef, {
      sender: 'user',
      text: text,
      timestamp: serverTimestamp()
    });
    els.chatInput.value = '';
  };

  function renderChatMsg(sender, text) {
    const div = document.createElement('div');
    div.className = `chat-msg ${sender}`;
    div.textContent = text;
    els.chatMessages.appendChild(div);
    els.chatMessages.scrollTop = els.chatMessages.scrollHeight;
  }

  window.leaveLiveChat = () => {
    showScreen('setupScreen');
    // Disable listener by reloading screen structure conceptually, 
    // real app would unsubscribe `onChildAdded` here.
  };

  /* =========================================
     AI VOICE CALL 
     ========================================= */
  function initSR() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { alert("Speech Recognition not supported in this browser."); return false; }
    speechRecognition = new SR();
    speechRecognition.continuous = false; 
    speechRecognition.interimResults = false;
    speechRecognition.onresult = async e => {
      if (!isCallActive) return;
      const text = e.results[0][0].transcript.trim();
      if (text) await processUtterance(text);
    };
    speechRecognition.onend = () => { if (isCallActive && !isMuted) speechRecognition.start(); };
    return true;
  }

  window.startCall = () => {
    if (!XAI_API_KEY || !initSR()) return;
    isCallActive = true; 
    isMuted = false;
    currentAudio = new Audio();
    conversationHistory = [{ role: "system", content: "You are a helpful technical support AI. Be concise (1-2 sentences). If user needs human help, append [HUMAN_REQUEST]." }];
    
    showScreen('callScreen');
    els.sText.innerText = "Connected";
    els.agentSub.innerText = "Listening...";
    
    const greet = "Hi there. I'm your AI assistant. How can I help you today?";
    conversationHistory.push({ role: "assistant", content: greet });
    speakAI(greet);
  };

  async function processUtterance(text) {
    if(speechRecognition) speechRecognition.stop();
    els.sText.innerText = "Thinking...";
    els.agentSub.innerText = "Processing...";
    els.orbWrap.classList.remove('speaking');
    
    conversationHistory.push({ role: 'user', content: text });

    try {
      const res = await fetch(`${API_BASE}/chat/completions`, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${XAI_API_KEY}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ model: "grok-beta", messages: conversationHistory, stream: false })
      });
      const data = await res.json();
      let reply = data.choices[0].message.content;

      if (reply.includes("[HUMAN_REQUEST]")) {
        reply = reply.replace("[HUMAN_REQUEST]", "").trim();
        await speakAI(reply);
        setTimeout(() => {
           endCall(); 
           startLiveChat(); 
        }, 3000);
        return;
      }

      conversationHistory.push({ role: 'assistant', content: reply });
      await speakAI(reply);
    } catch (err) {
      if (speechRecognition && isCallActive && !isMuted) speechRecognition.start();
    }
  }

  async function speakAI(text) {
    if (!isCallActive) return;
    els.sText.innerText = "Speaking";
    els.agentSub.innerText = "Assistant is speaking...";
    els.orbWrap.classList.add('speaking');

    try {
      const r = await fetch(`${API_BASE}/tts`, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${XAI_API_KEY}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ text, voice_id: 'ara', language: 'en' })
      });
      const blob = await r.blob();
      currentAudio.src = URL.createObjectURL(blob);
      currentAudio.onended = () => {
        els.orbWrap.classList.remove('speaking');
        els.sText.innerText = "Connected";
        els.agentSub.innerText = "Listening...";
        if (isCallActive && !isMuted && speechRecognition) speechRecognition.start();
      };
      await currentAudio.play();
    } catch {
      if (speechRecognition && isCallActive && !isMuted) speechRecognition.start();
    }
  }

  window.toggleMute = () => {
    isMuted = !isMuted;
    document.getElementById('muteBtn').classList.toggle('muted', isMuted);
    document.getElementById('muteIcon').innerText = isMuted ? 'mic_off' : 'mic';
    if (isMuted && speechRecognition) speechRecognition.stop();
    else if (!isMuted && speechRecognition) speechRecognition.start();
  };

  window.endCall = () => {
    isCallActive = false;
    if (speechRecognition) speechRecognition.stop();
    if (currentAudio) currentAudio.pause();
    showScreen('setupScreen');
  };

</script>
</body>
</html>
