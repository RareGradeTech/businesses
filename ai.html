<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RareGrade | Live Support</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .chat-scroll::-webkit-scrollbar { width: 4px; }
        .chat-scroll::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        .msg-client { border-radius: 18px 18px 4px 18px; background: #2563eb; color: white; }
        .msg-agent { border-radius: 18px 18px 18px 4px; background: #f1f5f9; color: #1e293b; }
    </style>
</head>
<body class="bg-slate-50 h-screen flex flex-col items-center justify-center p-4">

    <!-- CHAT CONTAINER -->
    <div class="w-full max-w-lg bg-white rounded-2xl shadow-2xl overflow-hidden flex flex-col h-[600px] border border-gray-100">
        
        <!-- HEADER -->
        <header class="bg-blue-600 p-4 text-white flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-white/20 rounded-full flex items-center justify-center">
                    <i class="fa-solid fa-headset text-lg"></i>
                </div>
                <div>
                    <h2 class="font-bold leading-tight">RareGrade Support</h2>
                    <p class="text-[11px] opacity-80" id="support-status">Typically replies in minutes</p>
                </div>
            </div>
            <button onclick="location.reload()" class="opacity-70 hover:opacity-100"><i class="fa-solid fa-rotate"></i></button>
        </header>

        <!-- MESSAGES AREA -->
        <div id="chat-box" class="flex-1 overflow-y-auto p-4 space-y-4 chat-scroll bg-gray-50/50">
            <!-- Welcome Message -->
            <div class="flex flex-col items-start">
                <div class="msg-agent p-3 text-sm shadow-sm">
                    Hello! How can we help you today? Please enter your name and message below to start a live chat.
                </div>
            </div>
        </div>

        <!-- RESOLVED OVERLAY -->
        <div id="resolved-notice" class="hidden bg-yellow-50 p-3 text-center border-t border-yellow-100">
            <p class="text-xs text-yellow-700 font-medium">This conversation has been marked as resolved.</p>
            <button onclick="startNewChat()" class="text-xs text-blue-600 underline mt-1">Start new conversation</button>
        </div>

        <!-- INPUT AREA -->
        <div id="input-area" class="p-4 bg-white border-t border-gray-100">
            <!-- Name Field (Only shown if no active chat) -->
            <div id="name-field-container" class="mb-2">
                <input type="text" id="client-name" placeholder="Your Name" class="w-full p-2 text-sm bg-gray-50 border border-gray-200 rounded-lg outline-none focus:border-blue-500 mb-2">
            </div>

            <div class="flex items-end gap-2">
                <textarea id="client-msg" rows="1" placeholder="Type your message..." 
                    class="flex-1 p-3 bg-gray-50 border border-gray-200 rounded-xl resize-none outline-none focus:border-blue-500 text-sm"
                    onkeypress="if(event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); handleSend(); }"></textarea>
                <button onclick="handleSend()" id="send-btn" class="w-11 h-11 bg-blue-600 text-white rounded-full flex items-center justify-center hover:bg-blue-700 transition active:scale-90 shadow-md">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <p class="mt-4 text-gray-400 text-[10px] uppercase tracking-widest">Powered by RareGrade Systems</p>

    <!-- FIREBASE -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCh7Ute6LeSAxcNDEQwZg5m0cA4ujnLCfg",
            authDomain: "test-17881.firebaseapp.com",
            projectId: "test-17881",
            storageBucket: "test-17881.firebasestorage.app",
            messagingSenderId: "1057428047643",
            appId: "1:1057428047643:web:f3801c0d933225a5cd35be"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let chatId = localStorage.getItem('rg_chat_id');
        let clientName = localStorage.getItem('rg_client_name');

        if (chatId) {
            initChatSession();
            document.getElementById('name-field-container').classList.add('hidden');
        }

        async function handleSend() {
            const msgInput = document.getElementById('client-msg');
            const nameInput = document.getElementById('client-name');
            const text = msgInput.value.trim();
            
            if (!text) return;

            // If it's a first-time message
            if (!chatId) {
                const name = nameInput.value.trim() || "Anonymous Client";
                clientName = name;
                localStorage.setItem('rg_client_name', name);
                
                const newChatRef = db.ref('live_support_chats').push();
                chatId = newChatRef.key;
                localStorage.setItem('rg_chat_id', chatId);

                await newChatRef.set({
                    clientName: clientName,
                    status: 'pending',
                    lastMessage: text,
                    lastActivity: firebase.database.ServerValue.TIMESTAMP,
                    agentId: null
                });

                document.getElementById('name-field-container').classList.add('hidden');
                initChatSession();
            }

            // Push the message
            await db.ref(`live_support_chats/${chatId}/messages`).push({
                sender: 'client',
                text: text,
                timestamp: firebase.database.ServerValue.TIMESTAMP
            });

            // Update Metadata
            await db.ref(`live_support_chats/${chatId}`).update({
                lastMessage: text,
                lastActivity: firebase.database.ServerValue.TIMESTAMP
            });

            msgInput.value = '';
        }

        function initChatSession() {
            const chatBox = document.getElementById('chat-box');
            const statusText = document.getElementById('support-status');
            
            // Listen for Messages
            db.ref(`live_support_chats/${chatId}/messages`).on('child_added', (snap) => {
                const m = snap.val();
                appendMessage(m.sender, m.text, m.timestamp);
            });

            // Listen for Agent Assignment & Resolution
            db.ref(`live_support_chats/${chatId}`).on('value', (snap) => {
                const data = snap.val();
                if (!data) return;

                if (data.agentName) {
                    statusText.innerText = `Chatting with ${data.agentName}`;
                    statusText.classList.add('text-green-200');
                }

                if (data.status === 'resolved') {
                    document.getElementById('input-area').classList.add('hidden');
                    document.getElementById('resolved-notice').classList.remove('hidden');
                }
            });
        }

        function appendMessage(sender, text, timestamp) {
            const chatBox = document.getElementById('chat-box');
            const isClient = sender === 'client';
            const time = new Date(timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

            const html = `
                <div class="flex flex-col ${isClient ? 'items-end' : 'items-start'}">
                    <div class="max-w-[85%] p-3 text-sm shadow-sm ${isClient ? 'msg-client' : 'msg-agent'}">
                        ${text}
                    </div>
                    <span class="text-[9px] text-gray-400 mt-1">${time}</span>
                </div>
            `;
            chatBox.insertAdjacentHTML('beforeend', html);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function startNewChat() {
            localStorage.removeItem('rg_chat_id');
            location.reload();
        }
    </script>
</body>
</html>
