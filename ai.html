<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Rare Grade | Support Flow</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Rounded" rel="stylesheet"/>
  <style>
    :root {
      --bg-main: #f0f4f9; --bg-surface: #ffffff; --text-main: #1f1f1f; --text-dim: #444746; --border: #e3e3e3;
      --gemini-blue: #4285f4; --gemini-purple: #9b72cb; --gemini-red: #d96570;
      --grad-gemini: linear-gradient(135deg, var(--gemini-blue), var(--gemini-purple), var(--gemini-red));
      --accent: #0b57d0; --accent-light: #d3e3fd; --danger: #b3261e; --success: #146c2e;
    }
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body { font-family: 'Inter', sans-serif; background: var(--bg-main); color: var(--text-main); height: 100svh; display: flex; flex-direction: column; overflow: hidden; position: relative; }
    h1, h2, h3, .brand-font { font-family: 'Outfit', sans-serif; }
    
    /* Screen Management */
    .screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; transition: opacity 0.4s ease, transform 0.4s ease; padding: 24px; }
    .hidden { opacity:0; pointer-events:none; transform: scale(0.98); }
    
    /* Setup Card */
    .setup-card { background: var(--bg-surface); border-radius: 32px; padding: 40px; width: 100%; max-width: 440px; box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04); transition: all 0.3s ease; }
    .brand-header { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
    .brand-logo { width: 40px; height: 40px; border-radius: 12px; background: var(--grad-gemini); display: flex; align-items: center; justify-content: center; color: white; }
    .brand-title { font-size: 1.4rem; font-weight: 600; letter-spacing: -0.5px; }
    .setup-sub { color: var(--text-dim); font-size: 1rem; line-height: 1.5; margin-bottom: 32px; }
    
    /* Selectors */
    .type-selector { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
    .type-card { border: 1px solid var(--border); border-radius: 20px; padding: 20px 16px; text-align: center; cursor: pointer; transition: all 0.2s ease; background: var(--bg-surface); }
    .type-card:hover { background: #f8fafd; border-color: #c2e7ff; }
    .type-card.selected { background: var(--accent-light); border-color: var(--accent); color: var(--accent); }
    .type-card .material-symbols-rounded { font-size: 28px; margin-bottom: 8px; }
    .type-card.selected .material-symbols-rounded { background: var(--grad-gemini); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    
    .voice-section { transition: opacity 0.3s ease, height 0.3s ease; overflow: hidden; }
    .voice-section.collapsed { opacity: 0; height: 0; pointer-events: none; margin-bottom: 0; }
    .voice-section-title { font-size: 0.85rem; font-weight: 600; color: var(--text-dim); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
    .voice-chips { display:flex; flex-direction:column; gap:8px; margin-bottom:32px; }
    .voice-chip { display:flex; align-items:center; gap:16px; padding:16px; border-radius:16px; border:1px solid var(--border); background:var(--bg-surface); cursor:pointer; transition:all 0.2s ease; }
    .voice-chip.selected { border-color: var(--gemini-purple); background: #fcfaff; }
    .voice-chip-check { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; }
    .voice-chip.selected .voice-chip-check { background: var(--gemini-purple); border-color: var(--gemini-purple); }
    .voice-chip.selected .voice-chip-check::after { content: '✓'; font-size: 12px; color: white; font-weight: bold; }

    .start-btn { width:100%; padding:16px; border-radius: 99px; background: var(--text-main); border:none; color:#fff; font-family:'Outfit',sans-serif; font-size: 1.05rem; font-weight:500; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;}

    /* Call Screen */
    .call-status { display: inline-flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--text-dim); background: var(--bg-surface); padding: 6px 16px; border-radius: 99px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-top: 12px; }
    .status-dot { width:8px; height:8px; border-radius:50%; background:var(--text-dim); }
    .status-dot.s-active { background: var(--success); }
    .status-dot.s-listening { background: var(--accent); }
    .status-dot.s-ringing { background: var(--gemini-purple); }

    .orb-wrap { position:relative; width:240px; height:240px; display:flex; align-items:center; justify-content:center; margin: 40px 0; }
    .orb-core { width: 140px; height: 140px; border-radius: 50%; background: var(--bg-surface); display:flex; align-items:center; justify-content:center; box-shadow: 0 4px 20px rgba(0,0,0,0.05); position: relative; z-index: 2; }
    .orb-glow { position: absolute; inset: -20px; border-radius: 50%; background: var(--grad-gemini); filter: blur(28px); opacity: 0.15; z-index: 0; }
    .speaking .orb-glow { opacity: 0.6; transform: scale(1.15); animation: pulseGlow 2s infinite alternate; }
    @keyframes pulseGlow { from { filter: blur(28px); } to { filter: blur(40px); } }

    /* Chat Screen */
    #chatScreen { padding: 0; }
    .chat-container { background: var(--bg-surface); width: 100%; height: 100svh; display: flex; flex-direction: column; overflow: hidden; }
    .chat-header { padding: 20px 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .chat-messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; background: var(--bg-main); }
    .msg-bubble { padding: 12px 16px; border-radius: 20px; max-width: 85%; font-size: 0.95rem; line-height: 1.5; }
    .msg-bubble.user { align-self: flex-end; background: var(--text-main); color: #fff; border-bottom-right-radius: 4px; }
    .msg-bubble.agent { align-self: flex-start; background: #fff; border: 1px solid var(--border); border-bottom-left-radius: 4px; }
    .msg-bubble.system { align-self: center; background: none; color: var(--text-dim); font-size: 0.8rem; text-align: center; }
    .chat-input-area { padding: 16px 20px calc(16px + env(safe-area-inset-bottom)); background: var(--bg-surface); border-top: 1px solid var(--border); display: flex; gap: 12px; }
    .chat-input { flex: 1; background: var(--bg-main); border: 1px solid transparent; border-radius: 99px; padding: 12px 20px; outline: none; }
    .send-btn { width: 44px; height: 44px; border-radius: 50%; background: var(--accent); color: white; border: none; display: flex; align-items: center; justify-content: center; }
  </style>
</head>
<body>

  <!-- SETUP SCREEN -->
  <div class="screen" id="setupScreen">
    <div class="setup-card">
      <div class="brand-header">
        <div class="brand-logo"><span class="material-symbols-rounded">graphic_eq</span></div>
        <h1 class="brand-title">Rare Grade Support</h1>
      </div>
      <p class="setup-sub">How would you like to connect with our support team today?</p>
      
      <div class="type-selector">
        <div class="type-card selected" data-type="ai" onclick="selectAgentType('ai')">
          <span class="material-symbols-rounded">auto_awesome</span><div class="type-card-title">AI Call Assistant</div>
        </div>
        <div class="type-card" data-type="human" onclick="selectAgentType('human')">
          <span class="material-symbols-rounded">chat</span><div class="type-card-title">Live Text Chat</div>
        </div>
      </div>
      
      <div class="voice-section" id="voiceSection">
        <div class="voice-section-title">Select a Voice Profile</div>
        <div class="voice-chips">
          <div class="voice-chip selected" data-voice="ara" onclick="selectVoice(this)">
            <div class="voice-chip-info"><div class="voice-chip-name">Ara</div><div class="voice-chip-desc">Warm & Friendly</div></div>
            <div class="voice-chip-check"></div>
          </div>
          <div class="voice-chip" data-voice="rex" onclick="selectVoice(this)">
            <div class="voice-chip-info"><div class="voice-chip-name">Rex</div><div class="voice-chip-desc">Tech Expert</div></div>
            <div class="voice-chip-check"></div>
          </div>
        </div>
      </div>
      
      <button class="start-btn" onclick="startFlow()">
        <span class="material-symbols-rounded" id="connectIcon" style="display:none;">login</span>
        <span id="connectText">Connect Now</span>
      </button>
    </div>
  </div>

  <!-- VOICE CALL SCREEN -->
  <div class="screen hidden" id="callScreen">
    <div class="call-status"><div class="status-dot" id="sDot"></div><span id="sText">Connecting...</span></div>
    <div class="orb-wrap" id="orbWrap">
      <div class="orb-glow"></div><div class="orb-core"><span class="material-symbols-rounded orb-icon" id="orbIcon">phone_in_talk</span></div>
    </div>
    <div class="agent-label">Support Assistant</div><div class="agent-sublabel" id="agentSub">Ringing…</div>
    <div class="transcript-wrap" id="transcriptBox" style="height:100px; overflow-y:auto; width:100%; max-width:400px; padding:20px;"></div>
    <div style="display:flex; gap:20px; margin-top:40px;">
      <button class="start-btn" style="background:var(--danger); width:72px; height:72px;" onclick="endAICall()"><span class="material-symbols-rounded">call_end</span></button>
    </div>
  </div>

  <!-- TEXT CHAT SCREEN -->
  <div class="screen hidden" id="chatScreen">
    <div class="chat-container">
      <div class="chat-header">
        <div class="brand-header"><h1 class="brand-title">Technician Chat</h1></div>
        <button onclick="endChat()" style="background:none; border:none; cursor:pointer;"><span class="material-symbols-rounded">close</span></button>
      </div>
      <div class="chat-messages" id="chatMessages"></div>
      <div class="chat-input-area">
        <input type="text" class="chat-input" id="chatInput" placeholder="Message support..." onkeypress="if(event.key==='Enter') sendChatMessage()"/>
        <button class="send-btn" onclick="sendChatMessage()"><span class="material-symbols-rounded">send</span></button>
      </div>
    </div>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, set, push, onChildAdded, onValue, update, onDisconnect } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
  import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

  const app = initializeApp({
    apiKey:"AIzaSyBOyZ3As4GTuNvjemvPF_SpsC6m6vqtNhc",
    authDomain:"fire-b-a8878.firebaseapp.com",
    projectId:"fire-b-a8878",
    databaseURL:"https://fire-b-a8878-default-rtdb.firebaseio.com",
    appId:"1:658673187627:web:6e4c29af661785f0afa36e"
  });

  const db = getDatabase(app);
  const auth = getAuth(app);
  const provider = new GoogleAuthProvider();

  let currentUser = null, myChatId, myChatRef, myMessagesRef, hasAgentJoined = false;
  let selectedAgentType = 'ai', currentVoice = 'ara', isCallActive = false;

  const els = {
    setup: document.getElementById('setupScreen'),
    call: document.getElementById('callScreen'),
    chat: document.getElementById('chatScreen'),
    chatMessages: document.getElementById('chatMessages'),
    chatInput: document.getElementById('chatInput'),
    connectText: document.getElementById('connectText'),
    connectIcon: document.getElementById('connectIcon')
  };

  onAuthStateChanged(auth, user => { currentUser = user; updateBtnUI(); });

  window.selectAgentType = type => {
    selectedAgentType = type;
    document.querySelectorAll('.type-card').forEach(c => c.classList.toggle('selected', c.dataset.type === type));
    document.getElementById('voiceSection').classList.toggle('collapsed', type === 'human');
    updateBtnUI();
  };

  window.selectVoice = el => {
    document.querySelectorAll('.voice-chip').forEach(c => c.classList.remove('selected'));
    el.classList.add('selected'); currentVoice = el.dataset.voice;
  };

  function updateBtnUI() {
    const isLoginNeeded = (selectedAgentType === 'human' && !currentUser);
    els.connectText.innerText = isLoginNeeded ? "Sign in to Chat" : "Connect Now";
    els.connectIcon.style.display = isLoginNeeded ? "inline-block" : "none";
  }

  window.startFlow = () => { selectedAgentType === 'human' ? startTextChat(false) : startAICall(); };

  // --- AI CALL STUBS (For Logic Continuity) ---
  function startAICall() {
    isCallActive = true; els.setup.classList.add('hidden'); els.call.classList.remove('hidden');
    setTimeout(() => { if(isCallActive) document.getElementById('agentSub').innerText = "AI Connected"; }, 2000);
  }
  window.endAICall = () => { isCallActive = false; els.call.classList.add('hidden'); els.setup.classList.remove('hidden'); };

  // --- SYNCHRONIZED TEXT CHAT LOGIC ---
  async function startTextChat(fromTransfer) {
    if (!currentUser) {
      try {
        const result = await signInWithPopup(auth, provider);
        currentUser = result.user;
      } catch (e) { return; }
    }

    isCallActive = false;
    els.setup.classList.add('hidden'); els.call.classList.add('hidden'); els.chat.classList.remove('hidden');
    els.chatMessages.innerHTML = '';
    appendChatMsg("Finding a technician...", "system");

    myChatId = 'chat_' + Date.now();
    // Matches Dashboard Node
    myChatRef = ref(db, 'live_support_chats/' + myChatId);
    myMessagesRef = ref(db, 'live_support_chats/' + myChatId + '/messages');

    const timestamp = Date.now();
    const welcomeMsg = fromTransfer ? "Transferred from AI Call." : "Chat started.";

    // Set structure for Support Desk Dashboard
    set(myChatRef, {
      id: myChatId,
      status: 'pending', // Triggers "New" badge on dashboard
      clientName: currentUser.displayName || 'User',
      clientId: currentUser.uid,
      lastMessage: welcomeMsg,
      lastActivity: timestamp,
      agentId: null,
      context: fromTransfer ? 'AI Transfer' : 'Direct Chat'
    });

    onDisconnect(myChatRef).update({ status: 'resolved' });

    onValue(myChatRef, snap => {
      const data = snap.val();
      if (data?.status === 'active' && !hasAgentJoined && data.agentId) {
        hasAgentJoined = true;
        appendChatMsg(`${data.agentName} has joined.`, "system");
      }
      if (data?.status === 'resolved') {
        appendChatMsg("Session closed.", "system");
        els.chatInput.disabled = true;
      }
    });

    onChildAdded(myMessagesRef, snap => {
      const m = snap.val();
      if (m.sender === 'agent') appendChatMsg(m.text, 'agent');
    });
  }

  window.sendChatMessage = () => {
    const text = els.chatInput.value.trim();
    if (!text) return;
    appendChatMsg(text, 'user');
    const ts = Date.now();
    push(myMessagesRef, { text, sender: 'client', timestamp: ts });
    update(myChatRef, { lastMessage: text, lastActivity: ts });
    els.chatInput.value = '';
  };

  function appendChatMsg(text, type) {
    const b = document.createElement('div');
    b.className = `msg-bubble ${type}`;
    b.innerText = text;
    els.chatMessages.appendChild(b);
    els.chatMessages.scrollTop = els.chatMessages.scrollHeight;
  }

  window.endChat = () => {
    if (myChatRef) update(myChatRef, { status: 'resolved' });
    els.chat.classList.add('hidden'); els.setup.classList.remove('hidden');
  };
</script>
</body>
</html>
