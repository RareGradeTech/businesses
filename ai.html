<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RareGrade Support</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        
        /* Full height layout fix for mobile browsers */
        .viewport-height { height: 100vh; height: 100dvh; }

        .chat-scroll::-webkit-scrollbar { width: 5px; }
        .chat-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        .msg-bubble { max-width: 85%; padding: 12px 16px; font-size: 0.95rem; line-height: 1.5; }
        .msg-client { border-radius: 20px 20px 4px 20px; background: #2563eb; color: white; margin-left: auto; }
        .msg-agent { border-radius: 20px 20px 20px 4px; background: #f1f5f9; color: #1e293b; }
        
        /* Floating animation for status */
        .status-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
    </style>
</head>
<body class="bg-white viewport-height flex flex-col overflow-hidden">

    <!-- TOP NAVIGATION / STATUS -->
    <header class="bg-white border-b border-gray-100 p-4 flex items-center justify-between shrink-0">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white shadow-lg shadow-blue-200">
                <i class="fa-solid fa-headset"></i>
            </div>
            <div>
                <h1 class="font-bold text-gray-900 leading-none">RareGrade Support</h1>
                <div id="status-container" class="mt-1 flex items-center gap-1.5">
                    <span id="status-dot" class="w-2 h-2 bg-orange-400 rounded-full status-pulse"></span>
                    <span id="status-text" class="text-[11px] font-medium text-gray-500 uppercase tracking-wider">Connecting...</span>
                </div>
            </div>
        </div>
        <button onclick="startNewChat()" class="text-gray-400 hover:text-red-500 transition text-sm">
            <i class="fa-solid fa-arrow-rotate-left"></i>
        </button>
    </header>

    <!-- MESSAGE AREA (Fills space) -->
    <main id="chat-box" class="flex-1 overflow-y-auto p-4 md:p-8 space-y-6 chat-scroll bg-slate-50/30">
        <!-- Initial Welcome -->
        <div class="flex flex-col items-start">
            <div class="msg-bubble msg-agent shadow-sm">
                👋 Welcome to RareGrade Support! Please send a message to start a session.
            </div>
        </div>
    </main>

    <!-- RESOLVED OVERLAY -->
    <div id="resolved-banner" class="hidden bg-gray-900 text-white p-4 text-center animate-bounce">
        <p class="text-sm font-medium">This session has ended.</p>
        <button onclick="startNewChat()" class="text-xs text-blue-400 font-bold uppercase mt-1">Start New Chat</button>
    </div>

    <!-- FLOATING INPUT AREA -->
    <footer id="input-container" class="p-4 bg-white border-t border-gray-100 pb-safe">
        <div class="max-w-4xl mx-auto flex flex-col gap-3">
            
            <!-- Name prompt if new session -->
            <div id="name-box" class="flex gap-2">
                <input type="text" id="client-name" placeholder="Enter your name..." 
                    class="flex-1 p-3 bg-gray-50 border border-gray-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500 transition">
            </div>

            <div class="flex items-end gap-2">
                <textarea id="client-msg" rows="1" placeholder="Describe your issue..." 
                    class="flex-1 p-4 bg-gray-100 border-none rounded-2xl resize-none outline-none focus:bg-gray-200 transition text-sm"
                    oninput="this.style.height = '';this.style.height = this.scrollHeight + 'px'"
                    onkeypress="if(event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); handleSend(); }"></textarea>
                
                <button onclick="handleSend()" class="w-12 h-12 bg-blue-600 text-white rounded-2xl flex items-center justify-center hover:bg-blue-700 transition active:scale-90 shadow-xl shadow-blue-200 shrink-0">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </footer>

    <!-- FIREBASE -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCh7Ute6LeSAxcNDEQwZg5m0cA4ujnLCfg",
            authDomain: "test-17881.firebaseapp.com",
            projectId: "test-17881",
            storageBucket: "test-17881.firebasestorage.app",
            messagingSenderId: "1057428047643",
            appId: "1:1057428047643:web:f3801c0d933225a5cd35be"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let chatId = localStorage.getItem('rg_chat_id');
        let clientName = localStorage.getItem('rg_client_name');

        // Check if resuming session
        if (chatId) {
            document.getElementById('name-box').classList.add('hidden');
            initChatSession();
        }

        async function handleSend() {
            const msgInput = document.getElementById('client-msg');
            const nameInput = document.getElementById('client-name');
            const text = msgInput.value.trim();
            
            if (!text) return;

            if (!chatId) {
                clientName = nameInput.value.trim() || "User_" + Math.floor(Math.random()*1000);
                localStorage.setItem('rg_client_name', clientName);
                
                const newChatRef = db.ref('live_support_chats').push();
                chatId = newChatRef.key;
                localStorage.setItem('rg_chat_id', chatId);

                await newChatRef.set({
                    clientName: clientName,
                    status: 'pending',
                    lastMessage: text,
                    lastActivity: firebase.database.ServerValue.TIMESTAMP,
                    agentId: null
                });

                document.getElementById('name-box').classList.add('hidden');
                initChatSession();
            }

            await db.ref(`live_support_chats/${chatId}/messages`).push({
                sender: 'client',
                text: text,
                timestamp: firebase.database.ServerValue.TIMESTAMP
            });

            await db.ref(`live_support_chats/${chatId}`).update({
                lastMessage: text,
                lastActivity: firebase.database.ServerValue.TIMESTAMP
            });

            msgInput.value = '';
            msgInput.style.height = 'auto';
        }

        function initChatSession() {
            const statusDot = document.getElementById('status-dot');
            const statusText = document.getElementById('status-text');

            // Listen for Messages
            db.ref(`live_support_chats/${chatId}/messages`).on('child_added', (snap) => {
                const m = snap.val();
                appendMessage(m.sender, m.text, m.timestamp);
            });

            // Monitor Agent Status
            db.ref(`live_support_chats/${chatId}`).on('value', (snap) => {
                const data = snap.val();
                if (!data) return;

                if (data.agentId && data.status !== 'resolved') {
                    statusText.innerText = `${data.agentName || 'Agent'} joined the chat`;
                    statusText.classList.remove('text-gray-500');
                    statusText.classList.add('text-green-600');
                    statusDot.classList.remove('bg-orange-400', 'status-pulse');
                    statusDot.classList.add('bg-green-500');
                }

                if (data.status === 'resolved') {
                    document.getElementById('input-container').classList.add('hidden');
                    document.getElementById('resolved-banner').classList.remove('hidden');
                    statusText.innerText = "Session Closed";
                    statusDot.classList.remove('bg-green-500');
                    statusDot.classList.add('bg-gray-400');
                }
            });
        }

        function appendMessage(sender, text, timestamp) {
            const chatBox = document.getElementById('chat-box');
            const isClient = sender === 'client';
            const time = new Date(timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

            const html = `
                <div class="flex flex-col ${isClient ? 'items-end' : 'items-start'} animate-fade-in">
                    <div class="msg-bubble shadow-sm ${isClient ? 'msg-client' : 'msg-agent'}">
                        ${text}
                    </div>
                    <span class="text-[10px] text-gray-400 mt-1.5 px-2">${isClient ? 'You' : 'Agent'} • ${time}</span>
                </div>
            `;
            chatBox.insertAdjacentHTML('beforeend', html);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function startNewChat() {
            localStorage.removeItem('rg_chat_id');
            location.reload();
        }
    </script>
</body>
</html>
