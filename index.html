<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Video Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        glass: 'rgba(255, 255, 255, 0.05)',
                        glassBorder: 'rgba(255, 255, 255, 0.1)',
                    },
                    boxShadow: {
                        'glow': '0 0 20px rgba(59, 130, 246, 0.5)',
                        'glow-hover': '0 0 30px rgba(96, 165, 250, 0.8)',
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom scrollbar for a premium feel */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #030712; }
        ::-webkit-scrollbar-thumb { background: #1f2937; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #374151; }
    </style>
</head>
<body class="bg-gray-950 text-white min-h-screen font-sans overflow-x-hidden">

    <nav class="fixed top-4 left-1/2 transform -translate-x-1/2 w-[95%] max-w-7xl z-50">
        <div class="bg-glass backdrop-blur-xl border border-glassBorder rounded-full px-6 py-3 flex justify-between items-center shadow-lg">
            <div class="text-xl font-bold tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-purple-500 cursor-pointer" onclick="showView('feedView')">
                VISION
            </div>
            
            <div class="hidden md:flex w-1/3">
                <input type="text" placeholder="Search videos..." class="w-full bg-black/50 border border-gray-700 rounded-full px-5 py-2 text-sm focus:outline-none focus:border-blue-500 focus:shadow-glow transition-all duration-300">
            </div>

            <div class="flex gap-4">
                <button onclick="showView('uploadView')" class="px-5 py-2 rounded-full bg-white/10 hover:bg-white/20 border border-white/10 transition-all duration-300 hover:shadow-glow text-sm font-medium">
                    Upload
                </button>
                <button id="authBtn" class="px-5 py-2 rounded-full bg-blue-600 hover:bg-blue-500 transition-all duration-300 hover:shadow-glow text-sm font-medium">
                    Sign In
                </button>
            </div>
        </div>
    </nav>

    <main class="pt-32 pb-12 px-6 max-w-7xl mx-auto min-h-screen">

        <div id="feedView" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
            <div id="loadingFeed" class="col-span-full text-center text-gray-500 py-10">Loading feed...</div>
        </div>

        <div id="uploadView" class="hidden max-w-2xl mx-auto">
            <div class="bg-glass backdrop-blur-2xl border border-glassBorder rounded-3xl p-8 shadow-2xl">
                <h2 class="text-2xl font-bold mb-6 text-center">Upload Video</h2>
                <form id="uploadForm" class="space-y-6">
                    <div>
                        <label class="block text-sm text-gray-400 mb-2">Video Title</label>
                        <input type="text" id="videoTitle" required class="w-full bg-black/50 border border-gray-700 rounded-xl px-4 py-3 focus:outline-none focus:border-blue-500 focus:shadow-glow transition-all">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-400 mb-2">Description</label>
                        <textarea id="videoDesc" rows="3" class="w-full bg-black/50 border border-gray-700 rounded-xl px-4 py-3 focus:outline-none focus:border-blue-500 focus:shadow-glow transition-all"></textarea>
                    </div>
                    <div class="relative border-2 border-dashed border-gray-600 rounded-2xl p-10 text-center hover:border-blue-500 transition-colors group cursor-pointer">
                        <input type="file" id="videoFile" accept="video/*" required class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                        <div class="text-gray-400 group-hover:text-blue-400 transition-colors">
                            <svg class="w-12 h-12 mx-auto mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                            <p id="fileNameDisplay">Drag and drop or click to select video</p>
                        </div>
                    </div>
                    <button type="submit" id="uploadBtn" class="w-full py-3 rounded-full bg-gradient-to-r from-blue-600 to-purple-600 font-bold text-lg hover:shadow-glow-hover transition-all duration-300 transform hover:-translate-y-1">
                        Upload to Cloudinary
                    </button>
                    <div id="uploadStatus" class="text-center text-sm hidden mt-4 text-blue-400">Uploading... Please wait.</div>
                </form>
            </div>
        </div>

        <div id="playerView" class="hidden">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <div class="lg:col-span-2 space-y-6">
                    <div class="bg-black rounded-2xl overflow-hidden shadow-glow border border-glassBorder aspect-video">
                        <video id="mainPlayer" controls class="w-full h-full object-contain"></video>
                    </div>
                    <div>
                        <h1 id="playerTitle" class="text-3xl font-bold mb-2">Video Title</h1>
                        <div class="flex justify-between items-center border-b border-gray-800 pb-4 mb-4">
                            <span id="playerUploader" class="text-gray-400">Uploaded by...</span>
                            <button id="likeBtn" class="px-6 py-2 rounded-full bg-white/5 border border-white/10 hover:bg-white/10 transition-all flex items-center gap-2">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
                                <span id="likeCount">0</span>
                            </button>
                        </div>
                        <p id="playerDesc" class="text-gray-300 bg-white/5 p-4 rounded-xl border border-white/5"></p>
                    </div>
                </div>

                <div class="bg-glass backdrop-blur-lg border border-glassBorder rounded-2xl p-6 h-[800px] flex flex-col">
                    <h3 class="text-xl font-bold mb-4">Comments</h3>
                    <div id="commentsList" class="flex-1 overflow-y-auto space-y-4 mb-4 pr-2">
                        </div>
                    <form id="commentForm" class="mt-auto flex gap-2">
                        <input type="text" id="commentInput" placeholder="Add a comment..." required class="flex-1 bg-black/50 border border-gray-700 rounded-full px-4 py-2 text-sm focus:outline-none focus:border-blue-500">
                        <button type="submit" class="p-2 rounded-full bg-blue-600 hover:bg-blue-500 transition-colors">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                        </button>
                    </form>
                </div>
            </div>
        </div>

    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getDatabase, ref, push, set, onValue, serverTimestamp, query, orderByChild } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCh7Ute6LeSAxcNDEQwZg5m0cA4ujnLCfg",
            authDomain: "test-17881.firebaseapp.com",
            projectId: "test-17881",
            storageBucket: "test-17881.firebasestorage.app",
            messagingSenderId: "1057428047643",
            appId: "1:1057428047643:web:f3801c0d933225a5cd35be"
        };

        const CLOUDINARY_CLOUD = 'dqkujefxj'; 
        const CLOUDINARY_PRESET = 'banter_box';

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        
        let currentUser = null;
        let currentPlayingVideoId = null;

        // View Router
        window.showView = (viewId) => {
            ['feedView', 'uploadView', 'playerView'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            document.getElementById(viewId).classList.remove('hidden');
            if(viewId === 'feedView') loadFeed();
            if(viewId !== 'playerView') document.getElementById('mainPlayer').pause();
        };

        // Authentication Logic
        const authBtn = document.getElementById('authBtn');
        authBtn.addEventListener('click', () => {
            if (currentUser) {
                signOut(auth);
            } else {
                signInWithPopup(auth, new GoogleAuthProvider());
            }
        });

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if (user) {
                authBtn.textContent = 'Sign Out';
                // Save user profile to DB
                set(ref(db, 'users/' + user.uid), {
                    displayName: user.displayName,
                    email: user.email,
                    photoURL: user.photoURL
                });
            } else {
                authBtn.textContent = 'Sign In';
            }
        });

        // File Input UI Update
        const videoFileInput = document.getElementById('videoFile');
        videoFileInput.addEventListener('change', (e) => {
            if(e.target.files.length > 0) {
                document.getElementById('fileNameDisplay').textContent = e.target.files[0].name;
            }
        });

        // 1. CLOUDINARY UPLOAD LOGIC & DB SAVE
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentUser) return alert("Please sign in to upload.");

            const file = videoFileInput.files[0];
            const title = document.getElementById('videoTitle').value;
            const desc = document.getElementById('videoDesc').value;
            
            const submitBtn = document.getElementById('uploadBtn');
            const statusTxt = document.getElementById('uploadStatus');
            submitBtn.disabled = true;
            statusTxt.classList.remove('hidden');

            try {
                // Prepare FormData for Cloudinary Unsigned Upload
                const formData = new FormData();
                formData.append('file', file);
                formData.append('upload_preset', CLOUDINARY_PRESET);

                // Upload to Cloudinary REST API
                const uploadRes = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD}/video/upload`, {
                    method: 'POST',
                    body: formData
                });
                
                const cloudData = await uploadRes.json();
                
                if(cloudData.secure_url) {
                    // Generate thumbnail dynamically from Cloudinary by changing extension to .jpg
                    const thumbnailUrl = cloudData.secure_url.replace(/\.[^/.]+$/, ".jpg");

                    // Save to Firebase Realtime DB
                    const newVideoRef = push(ref(db, 'videos'));
                    await set(newVideoRef, {
                        title: title,
                        description: desc,
                        videoUrl: cloudData.secure_url,
                        thumbnailUrl: thumbnailUrl,
                        uploaderId: currentUser.uid,
                        uploaderName: currentUser.displayName,
                        timestamp: serverTimestamp()
                    });

                    alert("Upload Successful!");
                    document.getElementById('uploadForm').reset();
                    document.getElementById('fileNameDisplay').textContent = "Drag and drop or click to select video";
                    window.showView('feedView');
                } else {
                    throw new Error("Upload failed. Check Cloudinary settings.");
                }

            } catch (error) {
                console.error(error);
                alert("Error: " + error.message);
            } finally {
                submitBtn.disabled = false;
                statusTxt.classList.add('hidden');
            }
        });

        // 2. VIDEO FEED LOGIC
        function loadFeed() {
            const feedContainer = document.getElementById('feedView');
            const videosRef = query(ref(db, 'videos'));

            onValue(videosRef, (snapshot) => {
                feedContainer.innerHTML = '';
                if (!snapshot.exists()) {
                    feedContainer.innerHTML = '<div class="col-span-full text-center text-gray-500">No videos found. Be the first to upload!</div>';
                    return;
                }

                snapshot.forEach((childSnapshot) => {
                    const videoId = childSnapshot.key;
                    const data = childSnapshot.val();

                    // Glassmorphism Video Card with Glow
                    const card = document.createElement('div');
                    card.className = "bg-glass backdrop-blur-md border border-glassBorder rounded-2xl overflow-hidden cursor-pointer group transition-all duration-300 hover:shadow-glow transform hover:-translate-y-1";
                    card.onclick = () => playVideo(videoId, data);
                    
                    card.innerHTML = `
                        <div class="aspect-video relative overflow-hidden">
                            <img src="${data.thumbnailUrl}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" alt="Thumbnail">
                            <div class="absolute inset-0 bg-black/20 group-hover:bg-transparent transition-colors"></div>
                        </div>
                        <div class="p-5">
                            <h3 class="font-bold text-lg mb-1 truncate">${data.title}</h3>
                            <p class="text-sm text-gray-400">${data.uploaderName || 'Anonymous'}</p>
                        </div>
                    `;
                    feedContainer.prepend(card); // Newest first
                });
            });
        }

        // 3. VIDEO PLAYER & REALTIME ENGAGEMENT
        window.playVideo = (videoId, data) => {
            currentPlayingVideoId = videoId;
            document.getElementById('mainPlayer').src = data.videoUrl;
            document.getElementById('playerTitle').textContent = data.title;
            document.getElementById('playerUploader').textContent = data.uploaderName || 'Anonymous';
            document.getElementById('playerDesc').textContent = data.description || 'No description provided.';
            
            document.getElementById('mainPlayer').play();
            window.showView('playerView');

            listenToComments(videoId);
            listenToLikes(videoId);
        };

        // Comments Submission
        document.getElementById('commentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentUser) return alert("Please sign in to comment.");
            
            const input = document.getElementById('commentInput');
            const text = input.value;
            
            if(text.trim() === '') return;

            const newCommentRef = push(ref(db, `comments/${currentPlayingVideoId}`));
            await set(newCommentRef, {
                text: text,
                userId: currentUser.uid,
                userName: currentUser.displayName,
                timestamp: serverTimestamp()
            });

            input.value = '';
        });

        // Realtime Comments Listener
        function listenToComments(videoId) {
            const commentsRef = ref(db, `comments/${videoId}`);
            const list = document.getElementById('commentsList');
            
            onValue(commentsRef, (snapshot) => {
                list.innerHTML = '';
                if(snapshot.exists()) {
                    snapshot.forEach((child) => {
                        const comment = child.val();
                        const el = document.createElement('div');
                        el.className = "bg-white/5 border border-white/5 p-3 rounded-xl";
                        el.innerHTML = `
                            <span class="font-bold text-sm text-blue-400">${comment.userName || 'User'}</span>
                            <p class="text-sm text-gray-200 mt-1">${comment.text}</p>
                        `;
                        list.appendChild(el);
                    });
                    // Scroll to bottom
                    list.scrollTop = list.scrollHeight;
                } else {
                    list.innerHTML = '<p class="text-sm text-gray-500 text-center">No comments yet.</p>';
                }
            });
        }

        // Likes Logic
        const likeBtn = document.getElementById('likeBtn');
        likeBtn.onclick = () => {
            if(!currentUser) return alert("Sign in to like videos.");
            const likeRef = ref(db, `likes/${currentPlayingVideoId}/${currentUser.uid}`);
            set(likeRef, true); // Overwrites to true
        };

        function listenToLikes(videoId) {
            const likesRef = ref(db, `likes/${videoId}`);
            onValue(likesRef, (snapshot) => {
                const count = snapshot.exists() ? snapshot.size : 0;
                document.getElementById('likeCount').textContent = count;
            });
        }

        // Initialize App
        window.onload = () => loadFeed();

    </script>
</body>
</html>
